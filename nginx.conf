# Nginx Load Balancer Configuration
# Routes traffic to multiple API instances

events {
    worker_connections 1024;
}

http {
    upstream healthbot_api {
        # Load balance across API instances
        least_conn;  # Send to least busy instance

        server api:8000 max_fails=3 fail_timeout=30s;
        # Add more if scaling beyond docker-compose
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            proxy_pass http://healthbot_api/health;
            proxy_set_header Host $host;
        }

        # API endpoints
        location / {
            proxy_pass http://healthbot_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeouts for LLM responses
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
}
