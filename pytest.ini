[pytest]
# pytest configuration for HealthBot test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 7.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests across components
    slow: Tests that take longer to run
    retrieval: Tests for retrieval components
    safety: Tests for safety detection
    reranker: Tests for cross-encoder reranker
    evaluation: Tests for evaluation metrics
    adversarial: Adversarial tests for edge cases and security (Phase 3)
    calculator: Medical calculator tool tests (Phase 4)
    pubmed: PubMed API integration tests (Phase 4)
    agent_tools: Agent tool wrapper tests (Phase 4)
    agent_graph: Agent graph workflow tests (Phase 4)

# Ignore paths
norecursedirs = .git .tox dist build *.egg venv

# Coverage options (if pytest-cov is installed)
# [coverage:run]
# source = healthbot
# omit = */tests/*

# Logging
log_cli = false
log_cli_level = INFO
