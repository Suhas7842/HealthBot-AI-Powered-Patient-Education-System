[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbot"
version = "2.0.0"
description = "AI-Powered Patient Education System with RAG"
authors = [
    {name = "Suhas Kumar Regeti", email = "rsuhaskumar3@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/yourusername/healthbot"
Repository = "https://github.com/yourusername/healthbot"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
